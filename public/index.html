<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Suki Lyrics</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">♪</div>
        <div>
          <h1>Suki Lyrics</h1>
          <p>Spotify search · synced lyrics · MP3 player</p>
        </div>
      </div>
    </header>

    <main>
      <section class="searchbox">
        <input id="query" autocomplete="off" placeholder="Cari lagu atau artis...">
        <button id="searchBtn">Cari</button>
      </section>

      <div id="status" class="status"></div>

      <section id="results" class="results"></section>

      <section id="player" class="player hidden">
        <div class="now">
          <img id="cover" src="" alt="">
          <div>
            <h2 id="title">-</h2>
            <p id="artist">-</p>
            <span id="album">-</span>
          </div>
        </div>

        <audio id="audio" controls preload="none"></audio>

        <div class="progress-row">
          <span id="current">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0">
          <span id="total">0:00</span>
        </div>

        <div id="lyrics" class="lyrics">
          <div class="empty">Pilih lagu untuk memuat lirik.</div>
        </div>
      </section>
    </main>

    <footer>
      <span>Lyrics: LRCLIB</span>
      <span>Audio: SpotSaver</span>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
